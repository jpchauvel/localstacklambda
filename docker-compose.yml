services:
  localstack:
    image: localstack/localstack-pro:4.0
    container_name: localstack-pubsub
    ports:
      - "4566:4566"
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?LOCALSTACK_AUTH_TOKEN required}
      SERVICES: lambda,events,apigatewayv2,elasticache,iam,logs,sts
      DEBUG: "1"
      PERSISTENCE: "0"
      LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: "60"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: curl -sf http://localhost:4566/_localstack/health || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
