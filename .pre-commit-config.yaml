# Pre-commit configuration
# Fast hooks run on `pre-commit`; slow hooks (tests, security) on `pre-push`.
# Install: `pre-commit install --hook-type pre-commit --hook-type pre-push`

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # ----- Generic file hygiene (pre-commit / fast) -----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]

  # ----- Ruff: format + lint (pre-commit / fast) -----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix]

  # ----- Terraform fmt (pre-commit / fast) -----
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt

  # ----- Mypy (pre-push / slow) -----
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        stages: [pre-push]
        files: ^src/
        args: [--ignore-missing-imports, --python-version=3.14]
        additional_dependencies:
          - pydantic>=2
          - types-redis

  # ----- Bandit (pre-push / slow, src only) -----
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        stages: [pre-push]
        args: [-r, src/]
        files: ^src/
        pass_filenames: false

  # ----- Gitleaks (pre-push / slow) -----
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [pre-push]

  # ----- Terraform validate (pre-push / slow) -----
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_validate
        stages: [pre-push]

  # ----- pip-audit + pytest (pre-push / slow, local) -----
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (dependency vulnerability scan)
        entry: pip-audit
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-unit
        # Only unit tests in pre-push: 18 fast tests, no LocalStack required.
        # Integration/e2e tests need LocalStack and run in a separate workflow.
        name: pytest (unit tests, no infra)
        entry: bash -c 'CI=true PAGER=cat AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_DEFAULT_REGION=us-east-1 python -m pytest tests/unit -q'
        language: system
        pass_filenames: false
        stages: [pre-push]
